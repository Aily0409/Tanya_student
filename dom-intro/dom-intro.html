<! DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Day</title>
    <style>
      *{
        font-family: system-ui;
      }
      body{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      p{
       font-size: 4rem;
       font-weight: bold;
       color: mediumvioletred;
       background-color: lavenderblush;
       padding: 1rem 2rem;
       border-radius: 1rem;
      }
    </style>
  </head>

  <body>
    <p>Today is <span id="label"></span></p>
    <button onclick="changeColor()">
      Make the text color orchid
    </button>
    
    <script>
  let date = new Date();
    let weekday = date.getDay();
    console.log(weekday);
    let label;
    
    if (weekday == 0){
      label ="Sunday";
    }else if (weekday==1){
      label="Monday";
    }else if (weekday==2){
      label="Tuesday";
    }else if(weekday==3){
      label="Wednesday";
    }else if (weekday==4){
      label="Thursday";
    }else if (weekday==5){
      label="Friday";
    } else{
      label="Saturday";
    }
    console.log(label);
    document.getElementById("label").innerHTML= label;
      
   function changeColor(){
     let myText = document.querySelector("p");
     let currentColor = window.getComputedStyle(myText).color;
     console.log(currentColor);
     
     if (currentColor == "rgb(199, 21, 133)"){
       myText.style.color = "orchid";
     } else{
       myText.style.color="mediumvioletred";
     }
     
     let buttonText = document.querySelector("button").innerText;
     
   }
      
  
      
  </script>
  </body>
</html>
