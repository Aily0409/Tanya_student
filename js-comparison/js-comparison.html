<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width-device-width, initial-scale=1.0" />
    <title>Comparison and Logical Operators</title>
  </head>
  <body>
    <script>
      //exercise 1
      let value1 = 10;
      let value2 = "hello";
      let result1 = value1 > 5;
      let result2 = value2.length == 5;
      let finalResult = result1 && result2;
      console.log("Exercise 1");
      console.log(finalResult);

      //exercise 2
      let stringA = "apple";
      let stringB = "banana";
      let comparisonResult = stringA < stringB;
      console.log("Exercise 2");
      console.log(comparisonResult);

      //exercise 3
      let num1 = 7;
      let num2 = "7";
      let strictEquality = num1 === num2;
      let looseEquality = num1 == num2;
      console.log("Exercise 3");
      console.log("Strict Equality");
      console.log(strictEquality);
      console.log("Loose Equality");
      console.log(looseEquality);
      //strict equality gave a false because a seven and a string seven are not the same, loose equality gave a true because even though they are different they are technically the same.
      
      //exercise 4
      let sunny = false;
      let raining = true;
      let canGoOutside = sunny ||raining;
      console.log("Exercise 4");
      console.log(canGoOutside);
      //I dont know why it is true
      
      //exercise 5
      let score = 85;
      let highscore= 90;
      let levelCompleted= true;
      let bonusAvailable = score && highscore && levelCompleted;
      let extraPoints = score ||highscore ||levelCompleted;
      console.log("Exercise 5")
      console.log(bonusAvailable);
      console.log(extraPoints);
      //in the first on it says true I dont know if it should say that but if I take out the levelcompleted it says 90.
      //in the second one it says 85 even without the level completed variable.
    </script>
  </body>
