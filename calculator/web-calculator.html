<! DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Web Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <h1>Web Calculator</h1>
    <input type="number" id="num1" value="0"/>
    <div class="buttons">
      <div class="operate" id="plus">➕</div>
      <div class="operate" id="minus">➖</div>
      <div class="operate" id="times">✖️</div>
      <div class="operate" id="divide">➗</div>
    </div>

    <input type="number" id="num2" value="0"/>
    <h2>
      Result:
      <div id="result"></div>
    </h2>
  </body>
</html>
